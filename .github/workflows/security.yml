name: Security

on:
  # PRs run via pull_request; push only for main, so a PR branch isn't checked twice.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *' # nightly: re-check the lockfile and the published image against new advisories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    # Known vulnerabilities in pnpm-lock.yaml (OSV database). Accepted findings go in osv-scanner.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

  sast:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          semgrep scan --error --metrics=off
          --config p/typescript --config p/nodejs --config p/owasp-top-ten

  secrets:
    # Scans the commits in the push or PR; only verified or unverifiable credentials are reported.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          # renovate: datasource=github-releases depName=trufflesecurity/trufflehog extractVersion=^v(?<version>.+)$
          version: 3.99.2
          extra_args: --results=verified,unknown

  workflows:
    # GitHub Actions security (zizmor) and correctness (actionlint).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # renovate: datasource=github-releases depName=zizmorcore/zizmor extractVersion=^v(?<version>.+)$
          version: 1.30.1
          advanced-security: false
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  config:
    # Misconfigurations in the Dockerfile and compose files.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.75.0
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  image:
    # The image Portainer deploys, re-scanned against advisories published since it was built.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.75.0
          image-ref: ghcr.io/the-bwc/opservbot:main
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
